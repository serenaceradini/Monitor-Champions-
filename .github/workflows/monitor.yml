name: Monitor Netwin

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Installa browser Playwright
        run: python -m playwright install --with-deps chromium

      - name: Controlla Netwin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva ultimo stato
        run: |
          git config user.name "Netwin Monitor"
          git config user.email "actions@github.com"

          git add last_state.txt

          git diff --cached --quiet || git commit -m "Aggiorna stato monitor"

          git push
